name: CI

on:
  push:
    branches: [main, "arena/**"]
  pull_request:
    branches: [main]

jobs:
  build-test:
    # ทุกโปรเจกต์เป็น net8.0-windows (WinForms) และ Tests อ้างอิง Agent/AgentService จึงต้องรันบน Windows
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "8.0.x"

      - name: Show .NET SDK version
        shell: pwsh
        run: dotnet --version

      - name: Build (Debug)
        shell: pwsh
        run: |
          dotnet build RainDrop.sln -c Debug --nologo -p:TreatWarningsAsErrors=true

      - name: Build (Release)
        shell: pwsh
        run: |
          dotnet build RainDrop.sln -c Release --nologo -p:TreatWarningsAsErrors=true

      - name: Test
        run: dotnet test Tests/Tests.csproj -c Release --no-build --logger "console;verbosity=normal" --logger "trx;LogFileName=test-results.trx" --results-directory TestResults

      - name: Test summary
        if: always()
        shell: pwsh
        run: |
          $trx = Get-ChildItem -Path TestResults -Recurse -Filter *.trx -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $trx) { Write-Host "::warning::no trx produced (build may have failed)"; exit 0 }
          [xml]$x = Get-Content -Raw $trx.FullName
          $c = $x.TestRun.ResultSummary.Counters
          $summary = "passed=$($c.passed) failed=$($c.failed) notExecuted=$($c.notExecuted) total=$($c.total)"
          Write-Host "TEST SUMMARY: $summary"
          Write-Host "::notice title=Test results::$summary"
          "## Test results`n`n$summary" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

          # ถ้ามีเทสต์ล้ม ให้รายงานชื่อเทสต์ + ข้อความ error ทั้งใน annotation และ step summary (เฟส B ข้อ 12)
          $failed = $x.TestRun.Results.UnitTestResult | Where-Object { $_.outcome -ne 'Passed' }
          if ($failed) {
            "## เทสต์ที่ล้ม`n" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
            foreach ($r in $failed) {
              $msg = [string]$r.Output.ErrorInfo.Message
              $safe = ($r.testName + ' :: ' + $msg).Replace('%','%25').Replace("`r",'%0D').Replace("`n",'%0A')
              Write-Host "::error title=Test $($r.outcome)::$safe"
              "- **$($r.testName)**: $msg`n" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
            }
          }

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: TestResults/**/*.trx
          if-no-files-found: ignore
